name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Windows x86_64 Build
  # ════════════════════════════════════════════════════════════════════════
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DDRT_BUILD_CLIENT=ON
          -DDRT_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package Windows Release
        run: |
          mkdir DrTournaments-Windows
          copy build\dr_tournaments.exe DrTournaments-Windows\
          copy build\dr_tournaments_server.exe DrTournaments-Windows\
          xcopy build\assets DrTournaments-Windows\assets\ /E /I /Y
          Compress-Archive -Path DrTournaments-Windows -DestinationPath DrTournaments-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DrTournaments-Windows-x64
          path: DrTournaments-Windows-x64.zip

  # ════════════════════════════════════════════════════════════════════════
  # Android ARM64 Build
  # ════════════════════════════════════════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Build native library
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DDRT_BUILD_CLIENT=ON \
            -DDRT_BUILD_SERVER=OFF \
            -G Ninja
          cmake --build build-android --config ${{ env.BUILD_TYPE }}

      - name: Build APK with Gradle
        working-directory: platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: DrTournaments-Android-arm64
          path: platform/android/app/build/outputs/apk/release/*.apk

  # ════════════════════════════════════════════════════════════════════════
  # Create GitHub Release (on tag push)
  # ════════════════════════════════════════════════════════════════════════
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DrTournaments-Windows-x64/DrTournaments-Windows-x64.zip
            artifacts/DrTournaments-Android-arm64/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
